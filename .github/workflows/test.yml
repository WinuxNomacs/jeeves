# Runs tests/run.sh on Linux, Windows (Git Bash) and macOS (its own bash 3.2), for a release tag or by hand.
# No push or pull-request trigger: start it from the Actions tab, or push a tag.
name: tests

on:
  push:
    tags: ["v*", "jeeves--v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # Windows Git Bash runs the suite slowest (104 tests took over 15 minutes there in November 2026; 142
    # took 29.5 minutes on 2026-11-20, and runs past 30 were cancelled).
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use the system bash 3.2 on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/bash32" && ln -sf /bin/bash "$RUNNER_TEMP/bash32/bash"
          echo "$RUNNER_TEMP/bash32" >> "$GITHUB_PATH"
      # age 1.3.2 for the age command line checks (age itself is built into Jeeves), pinned by the SHA-256 of each release archive (checked
      # 2026-11-17 against GitHub's asset digests). Its archives include age-plugin-batchpass.
      - name: Install age
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux)   a=linux-amd64.tar.gz;  sum=cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10 ;;
            macOS)   a=darwin-arm64.tar.gz; sum=e2020b073c44f692685a24d6abc378817eb81ffaaf49fd0531ef8565f767f2f5 ;;
            Windows) a=windows-amd64.zip;   sum=f48d8f8f9ebe903ab5027ed067652f2cc1db94bc206976430133b905dcd8e8c7 ;;
          esac
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 3 -o "age-$a" "https://github.com/FiloSottile/age/releases/download/v1.3.2/age-v1.3.2-$a"
          if command -v sha256sum >/dev/null; then got=$(sha256sum "age-$a"); else got=$(shasum -a 256 "age-$a"); fi
          got=${got%% *}
          [ "$got" = "$sum" ] || { echo "::error::age-v1.3.2-$a has SHA-256 $got, expected $sum"; exit 1; }
          case "$a" in *.zip) unzip -q "age-$a" ;; *) tar xzf "age-$a" ;; esac
          echo "$RUNNER_TEMP/age" >> "$GITHUB_PATH"
      # Go 1.27.4 for the Go build, pinned by the SHA-256 go.dev publishes for each archive (checked
      # 2026-11-20); downloaded as age is, so no action is added.
      - name: Install Go
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux)   a=linux-amd64.tar.gz;  sum=7226736c2339719cda28fbf3a54d71aa63bcefe376e98cef00034268dab24840 ;;
            macOS)   a=darwin-arm64.tar.gz; sum=91a44a2b8a716600ad94a4f143e156116620db8828086a6e3602291be9bd0bb4 ;;
            Windows) a=windows-amd64.zip;   sum=178ab98950ac69ab25069307dc6ade79f3816e414cce95b4da166a115cde1e7e ;;
          esac
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 3 -o "go-$a" "https://go.dev/dl/go1.27.4.$a"
          if command -v sha256sum >/dev/null; then got=$(sha256sum "go-$a"); else got=$(shasum -a 256 "go-$a"); fi
          got=${got%% *}
          [ "$got" = "$sum" ] || { echo "::error::go1.27.4.$a has SHA-256 $got, expected $sum"; exit 1; }
          case "$a" in *.zip) unzip -q "go-$a" ;; *) tar xzf "go-$a" ;; esac
          echo "$RUNNER_TEMP/go/bin" >> "$GITHUB_PATH"
      # The five builds committed in dist/ must be what this source builds to here, byte for byte.
      - name: Go checks and builds
        shell: bash
        env:
          GOTOOLCHAIN: local
        run: |
          go version
          unformatted=$(gofmt -l cmd internal)
          [ -z "$unformatted" ] || { echo "::error::not gofmt-formatted: $unformatted"; exit 1; }
          go vet ./...
          go test ./...
          bash .claude/skills/release/build-go.sh --check
      - name: Tests
        shell: bash
        run: |
          echo "bash: $(command -v bash) $(bash -c 'echo $BASH_VERSION')"
          echo "age: $(command -v age) $(age --version)"
          bash tests/run.sh 2>&1 | tee "$RUNNER_TEMP/tests.log"
          rc=${PIPESTATUS[0]}
          if grep -q "^skip age command line checks" "$RUNNER_TEMP/tests.log"; then
            echo "::error::the age command line checks were skipped"; exit 1
          fi
          exit "$rc"
